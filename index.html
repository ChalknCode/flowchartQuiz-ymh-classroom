<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>流程圖配對練習</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- =========================================
       1. LOGIN SCREEN
  ========================================== -->
  <div id="viewLogin">
    <div class="lp-bg" id="lpBg"></div>
    <div class="lp-blur"></div>
    <div class="lp-card">
      <div class="lp-left" id="lpLeft">
        <div class="lp-txt">
          <div class="lp-title-en">Flowchart Quiz</div>
          <div class="lp-title-zh">流程圖<span>配對</span>練習</div>
        </div>
      </div>
      <div class="lp-right">
        <div class="lp-form-title">學生登入</div>
        <div class="lp-form">
          <input type="text" id="loginId" class="lp-input" placeholder="請輸入班級座號 (例: 10101)" autocomplete="off" />
          <input type="password" id="loginPw" class="lp-input" placeholder="請輸入身分證字號" />
          <div class="lp-error" id="loginError"></div>
          <button class="lp-btn" id="btnLogin" onclick="doLogin()">開始作答</button>
        </div>
      </div>
    </div>
  </div>

  <!-- =========================================
       2. APP SCREEN
  ========================================== -->
  <div id="viewQuiz">
    <!-- Top bar -->
    <div class="tb">
      <div class="tb-brand">📊 流程圖配對練習</div>
      <div class="tb-sep"></div>
      <div class="tb-qid" id="tbQid">📋 載入中...</div>
      <!-- Timer -->
      <div class="tb-timer" id="tbTimer">⏱ 05:00</div>
      <!-- Score -->
      <div class="tb-score">✅ <span id="tbScoreNum">0</span> / <span id="tbScoreTotal">0</span></div>
      <div class="tb-sep"></div>
      
      <div style="display:flex; gap:10px;">
        <button class="btn" id="btnRestart" style="background:#fee2e2;color:#b91c1c;" onclick="restartQuiz()">🔄 重新作答</button>
        <button class="btn btn-ok" id="btnConfirm" onclick="confirmAnswer()" disabled>確認答案</button>
      </div>
      
      <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
        <button class="btn btn-sub" id="btnSubmit" onclick="submitScore()">📤 提交成績</button>
        <div class="tb-user" id="tbUser">尚未登入</div>
        <button class="btn" id="btnLogout" onclick="logout()" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #fff;">登出</button>
      </div>
    </div>

    <!-- Body Layout -->
    <div class="body">
      
      <!-- ① 題目欄 -->
      <div class="col-q">
        <div class="zh"><div class="zh-dot"></div>題目說明</div>
        <div class="q-body">
          <div class="q-title" id="qTitle">載入中...</div>
          <div class="q-desc" id="qDesc"></div>
          <div class="q-task-hd">提示：</div>
          <div class="q-hint" style="margin-top:0;">⬅ 從右側積木欄拖曳到中間作答區</div>
        </div>
      </div>

      <!-- ② 積木欄 -->
      <div class="col-b">
        <div class="zh"><div class="zh-dot"></div>積木</div>
        <div class="blk-list" id="blockList">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- ③ 作答區 -->
      <div class="col-ans">
        <div class="zh" style="background:#eae6f8;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:4px;"><div class="zh-dot"></div>作答區</div>
          <span style="font-size:0.62rem;color:#7c3aed;font-weight:700;letter-spacing:0;">拖曳左側積木至正確格子</span>
        </div>
        <div class="flow-area">
            <div class="q-flow-area" id="flowCol" style="position: relative; width: 100%; min-height: 800px; overflow-y: auto;">
              <svg id="canvasLines" width="100%" height="100%" style="position: absolute; top:0; left:0; pointer-events: none;"></svg>
              <!-- JS 會將 Drop Zones 渲染在這裡 -->
            </div>
        </div>
      </div>

    </div>
  </div>

  <!-- =========================================
       3. SUBMIT SUCCESS MODAL (FINAL SCREEN)
  ========================================== -->
  <div id="submitModal" style="display:none; position:fixed; inset:0; background:#e8e5f5; z-index:9999; flex-direction:column; align-items:center; justify-content:center;">
    <div class="modal-box" style="background:#fff; border-radius:24px; padding:40px 50px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,0.1);">
      <div style="font-size:4.5rem;margin-bottom:15px;">🎉</div>
      <div style="font-family:'M PLUS Rounded 1c',sans-serif;font-size:1.6rem;font-weight:900;color:#4f46e5;margin-bottom:12px;">恭喜你完成測驗！</div>
      <div style="font-size:1rem;color:#4b5563;margin-bottom:30px;line-height:1.6;" id="submitMsg">
        太棒了，<span id="modName" style="color:#111827;font-weight:800;">王小明</span>！<br>
        你這次花費了 <span style="font-weight:900;color:#059669;" id="modTime">02:15</span><br>
        總共答對了 <span style="font-weight:900;color:#059669;" id="modScore">2/7</span> 題。
      </div>
      <button onclick="location.reload()" style="background:#4f46e5;color:#fff;border:none;border-radius:99px;padding:12px 32px;font-size:1rem;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(79,70,229,0.3);transition:0.2s;">重新登入其他帳號</button>
    </div>
  </div>

  <!-- Load JS -->
  <script src="js/student.js"></script>
</body>
</html>
