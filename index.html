<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>流程圖配對練習</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ── 登入遮罩 ── -->
<div id="loginOverlay" class="overlay">
  <div class="modal">
    <div class="modal-icon">📊</div>
    <h2 class="modal-title">流程圖配對練習</h2>
    <p class="modal-desc">請輸入座號與密碼開始作答</p>
    <div class="form-group">
      <label class="form-label">座號</label>
      <input type="text" id="loginId" class="form-input" placeholder="例如：101" />
    </div>
    <div class="form-group">
      <label class="form-label">密碼</label>
      <input type="password" id="loginPw" class="form-input" placeholder="請輸入密碼" />
    </div>
    <button class="btn btn-primary w-full" onclick="doLogin()" id="btnLogin">開始作答</button>
    <div class="form-error" id="loginError">座號或密碼錯誤，請再試一次</div>
    <p class="text-sm text-gray mt-4">預覽測試：座號 <strong>101</strong>，密碼 <strong>1234</strong></p>
  </div>
</div>

<!-- ── 頂部列 ── -->
<div class="topbar">
  <div class="topbar-brand">
    <span class="icon">📊</span>
    流程圖配對練習
  </div>
  <div class="topbar-right">
    <span class="badge badge-indigo" id="studentBadge">未登入</span>
  </div>
</div>

<!-- ── 主畫面 ── -->
<div id="mainLayout" class="hidden" style="height:calc(100vh - 56px); display:flex; overflow:hidden;">

  <!-- 左側欄 -->
  <div id="sidebar" style="width:240px;min-width:240px;background:white;border-right:1px solid #e5e7eb;overflow-y:auto;padding:16px;display:flex;flex-direction:column;">
    <div style="font-size:.75rem;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.08em;padding-bottom:8px;border-bottom:2px solid #f3f4f6;">
      圖形選項
    </div>
    <p style="font-size:.78rem;color:#b0b7c3;text-align:center;margin:10px 0;">⬆ 拖曳到右側流程圖</p>
    <div id="optionList" style="display:flex;flex-direction:column;gap:8px;"></div>
  </div>

  <!-- 右側流程圖區 -->
  <div id="flowArea" style="flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:28px 20px;">
    <div id="questionTitle" style="font-size:1.2rem;font-weight:700;color:#1e1b4b;margin-bottom:20px;text-align:center;"></div>

    <div id="flowStart" class="flow-start-end hidden">START</div>

    <!-- 流程圖容器 (absolute positioning + SVG) -->
    <div id="flowWrapper" style="position:relative;margin:0 auto;"></div>

    <div id="flowEnd" class="flow-start-end hidden" style="margin-top:0;">END</div>

    <!-- 操作按鈕區 -->
    <div style="margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:12px;">
      <div class="score-banner hidden" id="scoreBanner">
        <div class="score-num" id="scoreNum"></div>
        <div class="score-label">答對 / 總題數</div>
      </div>
      <div class="wrong-hints hidden" id="wrongHints"></div>
      <button class="btn btn-primary" id="btnConfirm" onclick="confirmAnswer()" disabled>
        ✅ 確認答案
      </button>
      <button class="btn btn-success hidden" id="btnSubmit" onclick="submitScore()">
        📤 提交成績
      </button>
      <div class="success-msg hidden" id="successMsg">🎉 成績已送出！感謝作答</div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="js/student.js"></script>
</body>
</html>
